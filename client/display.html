<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape Bot · Fronta a pořadí</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020708;color:#e8ffff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:3vh 3vw;overflow:hidden;background:radial-gradient(circle at 50% 0,#12353b 0,#061215 42%,#020708 100%)}header{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid #2b6970;padding-bottom:1.5vh;margin-bottom:2.5vh}h1{margin:0;font-size:clamp(2rem,4vw,5rem);letter-spacing:.08em;color:#65f7ff}#clock{font-size:clamp(1.5rem,3vw,3.5rem);font-variant-numeric:tabular-nums}main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,.8fr);gap:2.5vw}section{min-width:0}h2{margin:0 0 1.5vh;font-size:clamp(1.35rem,2.05vw,2.7rem);letter-spacing:.06em;color:#a9fbff;white-space:nowrap}.queue-column{display:flex;min-height:0;flex-direction:column;gap:2vh}.queue{display:grid;gap:1.2vh}.team{display:grid;grid-template-columns:4rem minmax(0,1fr) auto;align-items:center;gap:1.2vw;padding:1.5vh 1.4vw;border:2px solid #28636a;border-radius:14px;background:rgba(5,31,35,.9)}.position{font-size:clamp(1.5rem,2.6vw,3rem);color:#65f7ff;font-weight:800;text-align:center}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(1.4rem,2.4vw,3rem);font-weight:750}.countdown{min-width:8ch;text-align:right;font-size:clamp(1.6rem,3vw,3.6rem);font-weight:850;font-variant-numeric:tabular-nums;color:#ffdc66}.team:first-child .countdown{color:#62ff8b;text-shadow:0 0 16px rgba(98,255,139,.5)}.lobby-entry{display:flex;align-items:center;gap:1.4vw;margin-top:auto;padding:1.3vh 1.2vw;border:2px solid #28636a;border-radius:14px;background:rgba(5,31,35,.9)}.lobby-entry img{width:clamp(110px,16vh,180px);height:clamp(110px,16vh,180px);padding:7px;background:#fff}.lobby-entry h2{margin-bottom:.6vh}.lobby-entry p{margin:.3vh 0;color:#b8dfe2;font-size:clamp(1rem,1.35vw,1.55rem)}.lobby-url{overflow-wrap:anywhere;color:#65f7ff!important;font-size:clamp(.72rem,.9vw,1rem)!important}.ranking-panel{position:relative;height:calc(94vh - 9rem);overflow:hidden}.ranking-slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease}.ranking-slide.active{opacity:1;pointer-events:auto}.ranking-viewport{height:calc(100% - 4.5rem);overflow:hidden}.ranking{list-style:none;margin:0;padding:0;display:grid;gap:.55vh;counter-reset:rank}.ranking li{counter-increment:rank;display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:.8vw;align-items:center;padding:.62vh .8vw;background:rgba(7,27,31,.82);border-left:5px solid #34767d;border-radius:7px;font-size:clamp(1.05rem,1.45vw,1.85rem)}.ranking li::before{content:counter(rank) '.';color:#65f7ff;font-weight:800;text-align:right}.rank-entry{min-width:0;line-height:1.05}.rank-entry strong{display:inline}.members{display:inline;margin-left:.7em;color:#8eb4b7;font-size:.36em;line-height:1.15;white-space:normal}.empty{padding:3vh;border:2px dashed #39636a;border-radius:14px;color:#93aaad;text-align:center;font-size:clamp(1.2rem,2vw,2.4rem)}#connection{font-size:clamp(.9rem,1.2vw,1.3rem);color:#62ff8b}#connection.offline{color:#ff7777}@media(max-width:900px){body{overflow:auto}main{grid-template-columns:1fr}.ranking-panel{height:70vh}.lobby-entry{margin-top:0}h2{white-space:normal}header{align-items:flex-start;flex-direction:column;gap:1vh}}
</style>
</head>
<body>
<header><div><h1>CHRONOTERMINÁL</h1><div id="connection">PŘIPOJUJI…</div></div><div id="clock"></div></header>
<main><section class="queue-column"><div><h2>FRONTA STARTŮ</h2><div id="queue" class="queue"><div class="empty">Načítám frontu…</div></div></div><aside class="lobby-entry"><img id="lobby-entry-qr" alt="QR odkaz do vstupní lobby"><div><h2>VSTUPNÍ LOBBY</h2><p>Naskenujte QR a založte nebo připojte tým.</p><p id="lobby-entry-url" class="lobby-url"></p></div></aside></section><section class="ranking-panel"><div id="team-slide" class="ranking-slide active"><h2>POŘADÍ TÝMŮ</h2><div id="team-viewport" class="ranking-viewport"><ol id="team-ranking" class="ranking"></ol><div id="team-ranking-empty" class="empty">Zatím bez týmových výsledků.</div></div></div><div id="solo-slide" class="ranking-slide"><h2>POŘADÍ JEDNOTLIVCŮ</h2><div id="solo-viewport" class="ranking-viewport"><ol id="solo-ranking" class="ranking"></ol><div id="solo-ranking-empty" class="empty">Zatím bez výsledků jednotlivců.</div></div></div></section></main>
<script>
let socket,queue=[],reconnectTimer,rankingTimer,activeRanking='team',scrollFrame,scrollStartedAt;
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
const duration=milliseconds=>{const seconds=Math.max(0,Math.ceil(milliseconds/1000)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),rest=seconds%60;return hours?`${hours}:${String(minutes).padStart(2,'0')}:${String(rest).padStart(2,'0')}`:`${minutes}:${String(rest).padStart(2,'0')}`};
function renderLobbyEntry(){const lobbyUrl=new URL('/',location.href);lobbyUrl.searchParams.set('team','1');document.getElementById('lobby-entry-qr').src=`/api/qr?data=${encodeURIComponent(lobbyUrl.href)}`;document.getElementById('lobby-entry-url').textContent=lobbyUrl.href}
function renderQueue(){const target=document.getElementById('queue');target.innerHTML=queue.length?queue.map(item=>`<article class="team"><div class="position">${Number(item.position)}.</div><div class="name">${escapeHtml(item.team_name)}</div><div class="countdown">${duration(new Date(item.planned_start_at)-new Date())}</div></article>`).join(''):'<div class="empty">Fronta je prázdná.</div>'}
function renderRankingList(id,entries){const ranking=document.getElementById(`${id}-ranking`);ranking.innerHTML=entries.map(entry=>{const name=escapeHtml(entry.name||(entry.mode==='solo'?'Bezejmenný hráč':'Bezejmenný tým'));const members=id==='team'&&(entry.players||[]).length?`<small class="members">${(entry.players||[]).map(escapeHtml).join(' · ')}</small>`:'';return `<li><span class="rank-entry"><strong>${name}</strong>${members}</span></li>`}).join('');document.getElementById(`${id}-ranking-empty`).style.display=entries.length?'none':'block'}
function renderRanking(entries){renderRankingList('team',entries.filter(entry=>entry.mode==='team'));renderRankingList('solo',entries.filter(entry=>entry.mode==='solo'));restartRankingCarousel()}
function restartRankingCarousel(){clearTimeout(rankingTimer);cancelAnimationFrame(scrollFrame);showRanking(activeRanking)}
function showRanking(kind){activeRanking=kind;document.querySelectorAll('.ranking-slide').forEach(slide=>slide.classList.toggle('active',slide.id===`${kind}-slide`));const viewport=document.getElementById(`${kind}-viewport`);viewport.scrollTop=0;const overflow=Math.max(0,viewport.scrollHeight-viewport.clientHeight);if(!overflow){rankingTimer=setTimeout(()=>showRanking(kind==='team'?'solo':'team'),8000);return}scrollStartedAt=performance.now()+3000;const speed=24;const animate=now=>{if(now<scrollStartedAt){scrollFrame=requestAnimationFrame(animate);return}viewport.scrollTop=Math.min(overflow,(now-scrollStartedAt)*speed/1000);if(viewport.scrollTop<overflow){scrollFrame=requestAnimationFrame(animate)}else{rankingTimer=setTimeout(()=>showRanking(kind==='team'?'solo':'team'),5000)}};scrollFrame=requestAnimationFrame(animate)}
function connect(){clearTimeout(reconnectTimer);const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${protocol}//${location.host}/ws`);socket.onopen=()=>{const status=document.getElementById('connection');status.textContent='● ŽIVÁ DATA';status.classList.remove('offline');socket.send(JSON.stringify({type:'leaderboard.get',payload:{}}))};socket.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==='runtime.settings'){queue=message.payload.start_queue||[];renderQueue()}if(message.type==='leaderboard.update')renderRanking(message.payload.entries||[])};socket.onclose=()=>{const status=document.getElementById('connection');status.textContent='● OBNOVUJI SPOJENÍ';status.classList.add('offline');reconnectTimer=setTimeout(connect,2000)};socket.onerror=()=>socket.close()}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});renderQueue()},1000);renderLobbyEntry();connect();
</script>
</body>
</html>
