<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape Bot · Fronta a pořadí</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020708;color:#e8ffff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:3vh 3vw;overflow:hidden;background:radial-gradient(circle at 50% 0,#12353b 0,#061215 42%,#020708 100%)}header{display:flex;align-items:end;justify-content:space-between;height:11vh;border-bottom:2px solid #2b6970;padding-bottom:1.5vh;margin-bottom:2.5vh}h1{margin:0;font-size:clamp(2rem,4vw,5rem);letter-spacing:.08em;color:#65f7ff}h2{margin:0 0 1.5vh;font-size:clamp(1.35rem,2.05vw,2.7rem);letter-spacing:.06em;color:#a9fbff;white-space:nowrap}.header-side{display:flex;align-items:end;gap:1.3vw}.lobby-link{display:flex;align-items:center;gap:.7vw;color:#a9fbff;font-size:clamp(.7rem,.9vw,1rem);text-align:right}.lobby-link img{width:clamp(58px,7vh,86px);height:clamp(58px,7vh,86px);padding:4px;background:#fff}.lobby-link strong{display:block;color:#65f7ff}.clock{font-size:clamp(1.5rem,3vw,3.5rem);font-variant-numeric:tabular-nums}.screen{position:absolute;inset:calc(14vh + 2.5vh) 3vw 3vh;opacity:0;visibility:hidden;transition:opacity .7s ease}.screen.active{opacity:1;visibility:visible}.dashboard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,.8fr);gap:2.5vw}.queue{display:grid;gap:1.2vh}.team{display:grid;grid-template-columns:4rem minmax(0,1fr) auto;align-items:center;gap:1.2vw;padding:1.5vh 1.4vw;border:2px solid #28636a;border-radius:14px;background:rgba(5,31,35,.9)}.position{font-size:clamp(1.5rem,2.6vw,3rem);color:#65f7ff;font-weight:800;text-align:center}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(1.4rem,2.4vw,3rem);font-weight:750}.countdown{min-width:8ch;text-align:right;font-size:clamp(1.6rem,3vw,3.6rem);font-weight:850;font-variant-numeric:tabular-nums;color:#ffdc66}.team:first-child .countdown{color:#62ff8b;text-shadow:0 0 16px rgba(98,255,139,.5)}.ranking-panel{position:relative;overflow:hidden}.ranking-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease}.ranking-slide.active{opacity:1;visibility:visible}.ranking{list-style:none;margin:0;padding:0;display:grid;gap:.55vh;counter-reset:rank}.ranking li{counter-increment:rank;display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:.8vw;align-items:center;padding:.62vh .8vw;background:rgba(7,27,31,.82);border-left:5px solid #34767d;border-radius:7px;font-size:clamp(1.05rem,1.45vw,1.85rem)}.ranking li::before{content:counter(rank) '.';color:#65f7ff;font-weight:800;text-align:right}.rank-entry{min-width:0;line-height:1.05}.members{display:inline;margin-left:.7em;color:#8eb4b7;font-size:.42em;line-height:1.15}.empty{padding:3vh;border:2px dashed #39636a;border-radius:14px;color:#93aaad;text-align:center;font-size:clamp(1.2rem,2vw,2.4rem)}.announcement{display:grid;place-items:center;padding:6vh 8vw;text-align:center}.announcement-text{max-width:1400px;white-space:pre-wrap;font-size:clamp(2.5rem,5.3vw,7rem);font-weight:750;line-height:1.2;text-shadow:0 0 25px rgba(101,247,255,.25)}.announcement-empty{color:#93aaad}.corner-countdown{position:absolute;right:0;bottom:0;max-width:32vw;padding:1vh 1vw;border:2px solid #28636a;border-radius:12px;background:rgba(3,20,23,.94);text-align:right;color:#a9fbff;font-size:clamp(.75rem,1vw,1.15rem)}.corner-countdown strong{display:block;color:#62ff8b;font-size:clamp(1.15rem,1.8vw,2.2rem);font-variant-numeric:tabular-nums}.cycle-progress{position:fixed;z-index:30;bottom:0;left:0;height:4px;background:#65f7ff;box-shadow:0 0 12px #65f7ff}#connection{font-size:clamp(.9rem,1.2vw,1.3rem);color:#62ff8b}#connection.offline{color:#ff7777}@media(max-width:900px){body{overflow:auto}.header-side{align-items:flex-start}.lobby-link span{display:none}.screen{position:relative;inset:auto;display:none;min-height:75vh}.screen.active{display:grid}.dashboard{grid-template-columns:1fr}.ranking-panel{min-height:60vh}h2{white-space:normal}header{height:auto;align-items:flex-start;flex-direction:column;gap:1vh}.corner-countdown{max-width:65vw}}
</style>
<style>
.announcement-grid{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2vw;text-align:left}.announcement-card{display:grid;align-content:center;overflow:hidden;padding:3vw;border:2px solid #28636a;border-radius:22px;background:rgba(5,31,35,.92);font-size:clamp(1.4rem,2.4vw,3.2rem);font-weight:700;line-height:1.3;white-space:pre-wrap}.announcement-card.main{grid-row:1/3;border-color:#65f7ff;font-size:clamp(2.2rem,4vw,5.2rem);box-shadow:0 0 30px rgba(101,247,255,.12)}.announcement-card.high{border-color:#ffdc66}.announcement-card.low{opacity:.82}.announcement-grid.single{grid-template-columns:1fr}.announcement-grid.single .main{grid-column:1;grid-row:1/3;text-align:center}.announcement-grid.pair .announcement-card:not(.main){grid-row:1/3}.announcement-page{position:absolute;left:0;top:0;color:#8eb4b7;font-size:clamp(.75rem,1vw,1.1rem)}@media(max-width:900px){.announcement-grid{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr))}.announcement-card.main{grid-row:auto}.announcement-grid.pair .announcement-card:not(.main){grid-row:auto}}
.display-status{display:flex;align-items:center;gap:.8vw;flex-wrap:wrap}.display-controls{display:flex;gap:.35vw;flex-wrap:wrap}.display-controls button{padding:.35em .65em;border:1px solid #28636a;border-radius:5px;background:#06191c;color:#a9fbff;font:inherit;font-size:clamp(.65rem,.8vw,.9rem);cursor:pointer}.display-controls button.active{border-color:#65f7ff;background:#12353b;color:#fff;box-shadow:0 0 8px rgba(101,247,255,.3)}
.announcement-feed{display:block;width:100%;height:100%;overflow-y:auto;padding-right:1vw;scrollbar-color:#34767d #06191c}.feed-card{margin:0 0 1.2vh;padding:1.3vh 1.4vw;border:1px solid #28636a;border-left:6px solid #65f7ff;border-radius:10px;background:rgba(5,31,35,.92);text-align:left;font-size:clamp(1rem,1.5vw,1.8rem);line-height:1.3;white-space:pre-wrap}.feed-card.high{border-left-color:#ffdc66}.feed-card.low{opacity:.78}.feed-card small{display:block;margin-bottom:.35em;color:#8eb4b7;font-size:.55em;letter-spacing:.1em}
.announcement-card.emergency,.feed-card.emergency{border-color:#ff4242;background:#31090b;box-shadow:0 0 35px rgba(255,40,40,.35)}.announcement-link{display:flex;align-items:center;gap:1vw;margin-top:1em;color:#65f7ff;font-size:.42em;text-decoration:none}.announcement-link img{width:clamp(62px,7vw,105px);height:clamp(62px,7vw,105px);padding:4px;background:#fff}.category-label{display:block;margin-bottom:.7em;color:#8eb4b7;font-size:.32em;letter-spacing:.1em}.emergency-active{background:radial-gradient(circle,#4a0b0e,#110203)!important}
</style>
</head>
<body>
<header><div><h1 id="display-title">CHRONOTERMINÁL</h1><div class="display-status"><div id="connection">PŘIPOJUJI…</div><div id="display-controls" class="display-controls"></div></div></div><div class="header-side"><a id="lobby-entry-link" class="lobby-link" href="/?team=1" style="text-decoration:none" aria-label="Otevřít vstupní lobby"><span><strong>VSTUPNÍ LOBBY</strong>NASKENUJTE NEBO KLIKNĚTE</span><img id="lobby-entry-qr" alt="QR odkaz do vstupní lobby"></a><div id="clock" class="clock"></div></div></header>
<main>
<section id="dashboard-screen" class="screen dashboard active"><section><h2>FRONTA STARTŮ</h2><div id="queue" class="queue"><div class="empty">Načítám frontu…</div></div></section><section class="ranking-panel"><div id="team-slide" class="ranking-slide active"><h2>POŘADÍ TÝMŮ</h2><ol id="team-ranking" class="ranking"></ol><div id="team-ranking-empty" class="empty">Zatím bez týmových výsledků.</div></div><div id="solo-slide" class="ranking-slide"><h2>POŘADÍ JEDNOTLIVCŮ</h2><ol id="solo-ranking" class="ranking"></ol><div id="solo-ranking-empty" class="empty">Zatím bez výsledků jednotlivců.</div></div></section></section>
<section id="announcement-screen" class="screen announcement"><div id="announcement-page" class="announcement-page"></div><div id="announcement-grid" class="announcement-grid"></div><div id="corner-countdown" class="corner-countdown"></div></section>
</main><div id="cycle-progress" class="cycle-progress"></div>
<script>
let socket,reconnectTimer,queue=[],allQueue=[],announcements=[],leaderboard=[],event=null,games=[],selectedGameId='',rotationStartedAt=Date.now(),lastAnnouncementVisit=-1,displayMode='auto',wakeLock=null,keepAwake=false,lastEmergencyId='';
const DASHBOARD_MS=15000,ANNOUNCEMENT_MS=30000,LOCK_MS=60000,RANKING_MS=15000;
const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
const duration=milliseconds=>{const seconds=Math.max(0,Math.ceil(milliseconds/1000)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),rest=seconds%60;return hours?`${hours}:${String(minutes).padStart(2,'0')}:${String(rest).padStart(2,'0')}`:`${minutes}:${String(rest).padStart(2,'0')}`};
function renderLobbyQr(){const url=new URL('/',location.href);url.searchParams.set('team','1');if(event?.id)url.searchParams.set('event',event.id);if(selectedGameId)url.searchParams.set('game',selectedGameId);document.getElementById('lobby-entry-link').href=url.href;document.getElementById('lobby-entry-qr').src=`/api/qr?data=${encodeURIComponent(url.href)}`}
function renderQueue(){const target=document.getElementById('queue');target.innerHTML=queue.length?queue.map(item=>`<article class="team"><div class="position">${Number(item.position)}.</div><div class="name">${escapeHtml(item.team_name)}</div><div class="countdown">${duration(new Date(item.planned_start_at)-new Date())}</div></article>`).join(''):'<div class="empty">Fronta je prázdná.</div>'}
function renderRankingList(id,entries){const ranking=document.getElementById(`${id}-ranking`);ranking.innerHTML=entries.map(entry=>{const name=escapeHtml(entry.name||(entry.mode==='solo'?'Bezejmenný hráč':'Bezejmenný tým'));const members=id==='team'&&(entry.players||[]).length?`<small class="members">${(entry.players||[]).map(escapeHtml).join(' · ')}</small>`:'';return `<li><span class="rank-entry"><strong>${name}</strong>${members}</span></li>`}).join('');document.getElementById(`${id}-ranking-empty`).style.display=entries.length?'none':'block'}
function visibleLeaderboard(){return leaderboard.filter(entry=>(!event?.id||entry.event_id===event.id)&&(!selectedGameId||entry.scenario_id===selectedGameId)&&entry.leaderboard_enabled!==false&&entry.competition_role!=='side')}
function renderRanking(){const entries=visibleLeaderboard();renderRankingList('team',entries.filter(entry=>entry.mode==='team'));renderRankingList('solo',entries.filter(entry=>entry.mode==='solo'))}
function nextTeam(){return queue.length?queue.reduce((next,item)=>new Date(item.planned_start_at)<new Date(next.planned_start_at)?item:next,queue[0]):null}
function showDashboard(enabled){document.getElementById('dashboard-screen').classList.toggle('active',enabled);document.getElementById('announcement-screen').classList.toggle('active',!enabled)}
const categoryLabels={organization:'📣 ORGANIZACE',lost_found:'🔎 ZTRÁTY A NÁLEZY',refreshment:'☕ OBČERSTVENÍ',results:'🏆 VÝSLEDKY',important:'⚠️ DŮLEŽITÉ'};
function activeAnnouncements(){const now=Date.now();return announcements.map((item,index)=>typeof item==='string'?{id:`legacy-${index}`,text:item,priority:'normal',category:'organization',published:true,index}:{...item,index}).filter(item=>item.text?.trim()&&item.published!==false&&(!item.event_id||item.event_id===event?.id)&&(!item.game_id||item.game_id===selectedGameId)&&(!item.starts_at||Date.parse(item.starts_at)<=now)&&(!item.ends_at||Date.parse(item.ends_at)>now)).map(item=>item.priority==='emergency'&&item.override_until&&Date.parse(item.override_until)<=now?{...item,priority:item.fallback_priority||'high'}:item)}
function announcementPages(){const weight={emergency:-1,high:0,normal:1,low:2};return activeAnnouncements().sort((a,b)=>(weight[a.priority]??1)-(weight[b.priority]??1)||a.index-b.index).reduce((pages,item,index)=>{const page=Math.floor(index/3);(pages[page]??=[]).push(item);return pages},[])}
function announcementLink(item){if(!item.link_url)return'';let parsed;try{parsed=new URL(item.link_url,location.href)}catch{return''}if(!['http:','https:'].includes(parsed.protocol))return'';const url=parsed.href;return `<a class="announcement-link" href="${escapeHtml(url)}" target="_blank" rel="noopener"><img src="/api/qr?data=${encodeURIComponent(url)}" alt="QR odkazu"><span>${escapeHtml(item.link_label||'Více informací')}</span></a>`}
function announcementCard(item,index){return `<article class="announcement-card ${index===0?'main ':''}${escapeHtml(item.priority||'normal')}"><small class="category-label">${categoryLabels[item.category]||categoryLabels.organization}</small>${escapeHtml(item.text)}${announcementLink(item)}</article>`}
function renderAnnouncementPage(visit){const pages=announcementPages(),items=pages[visit%pages.length]||[],grid=document.getElementById('announcement-grid');grid.className=`announcement-grid ${items.length===1?'single':items.length===2?'pair':''}`;grid.innerHTML=items.map(announcementCard).join('');document.getElementById('announcement-page').textContent=pages.length>1?`OZNÁMENÍ ${visit%pages.length+1} / ${pages.length}`:''}
function renderAllAnnouncements(){const items=announcementPages().flat(),grid=document.getElementById('announcement-grid');grid.className='announcement-feed';grid.scrollTop=0;grid.innerHTML=items.map((item,index)=>`<article class="feed-card ${escapeHtml(item.priority)}"><small>${index+1}. · ${categoryLabels[item.category]||categoryLabels.organization} · ${item.priority==='emergency'?'NOUZOVÉ':item.priority==='high'?'VYSOKÁ':item.priority==='low'?'NÍZKÁ':'BĚŽNÁ'} PRIORITA</small>${escapeHtml(item.text)}${announcementLink(item)}</article>`).join('');document.getElementById('announcement-page').textContent=`VŠECHNA OZNÁMENÍ · ${items.length}`}
function scrollAllAnnouncements(phase){const feed=document.getElementById('announcement-grid');if(!feed.classList.contains('announcement-feed')||feed.matches(':hover'))return;const overflow=Math.max(0,feed.scrollHeight-feed.clientHeight),progress=Math.max(0,Math.min(1,(phase-2500)/(ANNOUNCEMENT_MS-5000))),eased=progress<.5?4*progress*progress*progress:1-Math.pow(-2*progress+2,3)/2;feed.scrollTop=overflow*eased}
function renderEmergency(item){const grid=document.getElementById('announcement-grid');grid.className='announcement-grid single';grid.innerHTML=announcementCard(item,0);document.getElementById('announcement-page').textContent='⚠ NOUZOVÉ OZNÁMENÍ';document.body.classList.add('emergency-active')}
function playEmergencySignal(){try{const context=new(window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(delay=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.frequency.value=740;gain.gain.setValueAtTime(.12,context.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+delay+.16);oscillator.connect(gain).connect(context.destination);oscillator.start(context.currentTime+delay);oscillator.stop(context.currentTime+delay+.17)})}catch{}}
async function toggleFullscreen(){if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();renderDisplayControls()}
async function requestWakeLock(){if(!keepAwake||wakeLock||!('wakeLock'in navigator))return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;renderDisplayControls()})}catch{}}
async function toggleWakeLock(){keepAwake=!keepAwake;if(!keepAwake&&wakeLock){await wakeLock.release();wakeLock=null}else await requestWakeLock();renderDisplayControls()}
function setDisplayMode(mode){displayMode=mode;rotationStartedAt=Date.now();lastAnnouncementVisit=-1;if(mode==='all')renderAllAnnouncements();else if(mode.startsWith('announcement:'))renderAnnouncementPage(Number(mode.split(':')[1]));renderDisplayControls()}
function selectDisplayGame(gameId){selectedGameId=gameId;queue=allQueue.filter(item=>item.scenario_id===selectedGameId);rotationStartedAt=Date.now();lastAnnouncementVisit=-1;renderQueue();renderRanking();renderLobbyQr();renderDisplayControls()}
function renderDisplayControls(){const pages=announcementPages(),target=document.getElementById('display-controls');if((displayMode==='all'&&!pages.length)||(displayMode.startsWith('announcement:')&&Number(displayMode.split(':')[1])>=pages.length))displayMode='auto';const announcementButtons=pages.length?[['all','VŠECHNA OZNÁMENÍ'],...pages.map((_,index)=>[`announcement:${index}`,`OZNÁMENÍ ${index+1}`])]:[];const buttons=[['auto','AUTOMAT'],['queue','FRONTA'],...announcementButtons],gameButtons=games.filter(game=>game.event_role!=='side'&&game.leaderboard_enabled!==false).map(game=>`<button class="${selectedGameId===game.id?'active':''}" onclick="selectDisplayGame('${escapeHtml(game.id)}')">HRA: ${escapeHtml(game.title)}</button>`).join('');target.innerHTML=gameButtons+buttons.map(([mode,label])=>`<button class="${displayMode===mode?'active':''}" onclick="setDisplayMode('${mode}')">${label}</button>`).join('')+`<button onclick="toggleFullscreen()">${document.fullscreenElement?'ZAVŘÍT FULLSCREEN':'FULLSCREEN'}</button><button class="${keepAwake?'active':''}" onclick="toggleWakeLock()">${wakeLock?'DISPLEJ AKTIVNÍ':keepAwake?'ČEKÁ NA AKTIVACI':'NEUSPÁVAT'}</button>`}
function scrollRanking(kind,phase){const active=document.getElementById(`${kind}-slide`),inactive=document.getElementById(`${kind==='team'?'solo':'team'}-slide`),panel=active.parentElement;inactive.style.transform='translateY(0)';const overflow=Math.max(0,active.scrollHeight-panel.clientHeight),progress=Math.max(0,Math.min(1,(phase-2000)/(RANKING_MS-4000))),eased=progress<.5?4*progress*progress*progress:1-Math.pow(-2*progress+2,3)/2;active.style.transform=`translateY(${-overflow*eased}px)`}
function tick(){const elapsed=Date.now()-rotationStartedAt,next=nextTeam(),remaining=next?new Date(next.planned_start_at)-new Date():Infinity,locked=remaining<=LOCK_MS,active=activeAnnouncements(),emergency=active.find(item=>item.priority==='emergency'),pages=announcementPages(),hasAnnouncements=pages.length>0,announcementDuration=active.length===1?DASHBOARD_MS:ANNOUNCEMENT_MS;if((displayMode==='all'&&!hasAnnouncements)||(displayMode.startsWith('announcement:')&&Number(displayMode.split(':')[1])>=pages.length)){displayMode='auto';renderDisplayControls()}let dashboardPhase=true,rankingKind,rankingPhase,visit=-1,cycleLength=1,manualAnnouncement=false;if(emergency){dashboardPhase=false;manualAnnouncement=true;if(lastEmergencyId!==emergency.id){lastEmergencyId=emergency.id;renderEmergency(emergency);playEmergencySignal()}}else{if(lastEmergencyId){lastEmergencyId='';document.body.classList.remove('emergency-active');lastAnnouncementVisit=-1}if(locked||displayMode==='queue'){rankingKind=Math.floor(elapsed/RANKING_MS)%2===0?'team':'solo';rankingPhase=elapsed%RANKING_MS;cycleLength=RANKING_MS*2}else if(displayMode==='all'){dashboardPhase=false;cycleLength=ANNOUNCEMENT_MS;manualAnnouncement=true;scrollAllAnnouncements(elapsed%ANNOUNCEMENT_MS)}else if(displayMode.startsWith('announcement:')){dashboardPhase=false;visit=Number(displayMode.split(':')[1]);manualAnnouncement=true}else if(!hasAnnouncements){cycleLength=DASHBOARD_MS*2;const position=elapsed%cycleLength;rankingKind=position<DASHBOARD_MS?'team':'solo';rankingPhase=position%DASHBOARD_MS}else{cycleLength=2*(DASHBOARD_MS+announcementDuration);const cycleIndex=Math.floor(elapsed/cycleLength),position=elapsed%cycleLength,secondDashboardAt=DASHBOARD_MS+announcementDuration,secondAnnouncementAt=secondDashboardAt+DASHBOARD_MS;if(position<DASHBOARD_MS){rankingKind='team';rankingPhase=position}else if(position<secondDashboardAt){dashboardPhase=false;visit=cycleIndex*2}else if(position<secondAnnouncementAt){rankingKind='solo';rankingPhase=position-secondDashboardAt}else{dashboardPhase=false;visit=cycleIndex*2+1}}}showDashboard(dashboardPhase);if(dashboardPhase){document.getElementById('team-slide').classList.toggle('active',rankingKind==='team');document.getElementById('solo-slide').classList.toggle('active',rankingKind==='solo');scrollRanking(rankingKind,rankingPhase)}if(!emergency&&!dashboardPhase&&displayMode!=='all'&&visit!==lastAnnouncementVisit){lastAnnouncementVisit=visit;renderAnnouncementPage(visit)}const corner=document.getElementById('corner-countdown');corner.innerHTML=next?`DALŠÍ START · ${escapeHtml(next.team_name)}<strong>${duration(remaining)}</strong>`:'FRONTA JE PRÁZDNÁ';document.getElementById('cycle-progress').style.width=locked&&!emergency?'100%':manualAnnouncement&&displayMode!=='all'?'100%':`${elapsed%cycleLength/cycleLength*100}%`}
function connect(){clearTimeout(reconnectTimer);const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${protocol}//${location.host}/ws`);socket.onopen=()=>{const status=document.getElementById('connection');status.textContent='● ŽIVÁ DATA';status.classList.remove('offline');socket.send(JSON.stringify({type:'leaderboard.get',payload:{}}))};socket.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==='runtime.settings'){event=message.payload.event?.id?message.payload.event:null;games=message.payload.games||[];const competitive=games.filter(game=>game.event_role!=='side'&&game.leaderboard_enabled!==false);if(!competitive.some(game=>game.id===selectedGameId))selectedGameId=event?.primary_game_id||competitive[0]?.id||'';allQueue=message.payload.start_queue||[];queue=allQueue.filter(item=>!selectedGameId||item.scenario_id===selectedGameId);const branding=event?.branding||{};document.getElementById('display-title').textContent=branding.title||event?.name||'CHRONOTERMINÁL';if(branding.accent_color)document.documentElement.style.setProperty('--event-accent',branding.accent_color);const updated=message.payload.display_announcements||[];if(JSON.stringify(updated)!==JSON.stringify(announcements)){announcements=updated;rotationStartedAt=Date.now();lastAnnouncementVisit=-1;if(displayMode==='all')renderAllAnnouncements()}renderLobbyQr();renderQueue();renderRanking();renderDisplayControls()}if(message.type==='leaderboard.update'){leaderboard=message.payload.entries||[];renderRanking()}};socket.onclose=()=>{const status=document.getElementById('connection');status.textContent='● OBNOVUJI SPOJENÍ';status.classList.add('offline');reconnectTimer=setTimeout(connect,2000)};socket.onerror=()=>socket.close()}
function sendDisplayHeartbeat(){if(socket?.readyState!==WebSocket.OPEN)return;const screen=lastEmergencyId?'nouzové oznámení':document.getElementById('dashboard-screen').classList.contains('active')?'fronta a žebříček':displayMode==='all'?'všechna oznámení':`oznámení ${Math.max(1,(lastAnnouncementVisit%Math.max(1,announcementPages().length))+1)}`;socket.send(JSON.stringify({type:'display.heartbeat',payload:{mode:displayMode,screen,fullscreen:Boolean(document.fullscreenElement),wake_lock:Boolean(wakeLock),user_agent:navigator.userAgent}}))}
document.addEventListener('fullscreenchange',renderDisplayControls);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});setInterval(sendDisplayHeartbeat,5000);setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});renderQueue()},1000);function animate(){tick();requestAnimationFrame(animate)}renderLobbyQr();renderDisplayControls();animate();connect();
</script></body></html>
