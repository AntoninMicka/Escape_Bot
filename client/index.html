<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interkom - Jiná Dimenze</title>
    <style>
        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        #chat {
            flex-grow: 1;
            border: 1px solid #333;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 20px;
            background: #0a0a0a;
            box-shadow: inset 0 0 10px #000;
        }
        .message { margin-bottom: 10px; }
        .message.bot { color: #0f0; }
        .message.player { color: #0aa; text-align: right; }
        .controls {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-family: inherit;
        }
        button {
            padding: 10px 20px;
            background: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0a0; }
    </style>
</head>
<body>
    <h2>[ INTERKOM - SEKTOR 4 ]</h2>
    <div id="chat"></div>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Zadej zprávu nebo souřadnice (např. 734)..." onkeypress="if(event.key === 'Enter') sendMsg()" />
        <button onclick="sendMsg()">Odeslat</button>
    </div>

    <script>
        const ws = new WebSocket('ws://127.0.0.1:8765');
        const chat = document.getElementById('chat');
        const input = document.getElementById('msgInput');

        ws.onopen = () => ws.send(JSON.stringify({ type: 'client.hello', payload: {} }));

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'bot.message') chat.innerHTML += `<div class="message bot"><b>[Ztracená]:</b> ${msg.payload.text}</div>`;
            chat.scrollTop = chat.scrollHeight;
        };

        function sendMsg() {
            if (!input.value.trim()) return;
            ws.send(JSON.stringify({ type: 'player.message', payload: { text: input.value } }));
            chat.innerHTML += `<div class="message player"><b>[Ty]:</b> ${input.value}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
