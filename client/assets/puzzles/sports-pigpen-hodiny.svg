<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Šest znaků malého polského kříže</title>
  <desc id="desc">Řada šesti neznámých šifrových znaků oddělených do polí.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#073b42" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" fill="#020b0d"/>
  <rect x="18" y="18" width="1164" height="394" fill="url(#grid)" stroke="#00b9c8" stroke-width="2"/>
  <text x="600" y="66" fill="#65f7ff" font-family="monospace" font-size="28" text-anchor="middle" letter-spacing="4">ARCHIVNÍ OTISK // ŠEST ZNAKŮ</text>
  <text x="600" y="102" fill="#87aeb2" font-family="monospace" font-size="18" text-anchor="middle">ČTI ZLEVA DOPRAVA · ORIENTACI ZNAKŮ NEMĚŇ</text>

  <g fill="#03191c" stroke="#17616a" stroke-width="2">
    <rect x="55" y="135" width="160" height="210"/><rect x="241" y="135" width="160" height="210"/>
    <rect x="427" y="135" width="160" height="210"/><rect x="613" y="135" width="160" height="210"/>
    <rect x="799" y="135" width="160" height="210"/><rect x="985" y="135" width="160" height="210"/>
  </g>
  <g fill="none" stroke="#71fbff" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)">
    <!-- H: dolní prostřední pole první mřížky -->
    <path d="M95 292V206H175V292"/>
    <!-- O: levý otevřený tvar s tečkou -->
    <path d="M367 194H287V306H367"/>
    <!-- D: pravý otevřený tvar -->
    <path d="M461 194H541V306H461"/>
    <!-- I: levý horní roh -->
    <path d="M659 292V206H739"/>
    <!-- N: středové pole druhé mřížky s tečkou -->
    <rect x="833" y="204" width="92" height="92"/>
    <!-- Y: dolní klín druhého kříže s tečkou -->
    <path d="M1025 293L1065 207L1105 293"/>
  </g>
  <g fill="#71fbff" filter="url(#glow)">
    <circle cx="327" cy="250" r="10"/>
    <circle cx="906" cy="278" r="10"/>
    <circle cx="1065" cy="246" r="10"/>
  </g>
  <g fill="#4b858a" font-family="monospace" font-size="18" text-anchor="middle">
    <text x="135" y="380">01</text><text x="321" y="380">02</text><text x="507" y="380">03</text>
    <text x="693" y="380">04</text><text x="879" y="380">05</text><text x="1065" y="380">06</text>
  </g>
</svg>
