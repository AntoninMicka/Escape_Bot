<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Výzkumný areál CHRONOS · 3D</title>
  <script type="module" crossorigin src="./assets/chronos.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
<body>
  <canvas id="chronos-webgl" aria-label="WebGL prostor Ústavu CHRONOS"></canvas>
  <header><strong>VÝZKUMNÝ ÚSTAV CHRONOS // 3D AREÁL</strong><span id="zone">PŘÍZEMÍ · RECEPCE</span></header>
  <div id="reticle" aria-hidden="true">+</div>
  <section id="prompt" role="status">Klikněte do světa · WASD · E zařízení · I/B/C/M gadgety</section>
  <section id="story" role="status">Najděte a aktivujte recepční archiv.</section>
  <section id="fatal" role="alert" hidden></section>
  <section id="boot-status" role="status">INICIALIZACE 3D RENDERERU…</section>
  <div id="touch" aria-label="Dotykové ovládání">
    <button data-move="left">◀</button><button data-move="forward">▲</button><button data-move="right">▶</button>
    <button data-move="turn-left">↶</button><button data-move="backward">▼</button><button data-move="turn-right">↷</button>
    <button id="interact">E · INTERAKCE</button>
  </div>
  <button id="exit">I · INTERKOM</button>
  <script>
    const showFatal = message => {
      const panel = document.getElementById('fatal');
      panel.hidden = false;
      panel.replaceChildren(document.createTextNode(`WEBGL CHYBA: ${message}\n`));
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'ZNOVU NAČÍST 3D SVĚT';
      retry.addEventListener('click', () => location.reload());
      panel.append(retry);
    };
    window.showChronosFatal = showFatal;
    window.addEventListener('error', event => showFatal(event.message || 'Inicializace selhala.'));
    window.addEventListener('unhandledrejection', event => showFatal(event.reason?.message || String(event.reason)));
  </script>
</body>
</html>
